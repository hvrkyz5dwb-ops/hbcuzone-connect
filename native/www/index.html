<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PlugU</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; background: #0a0a0a; }
      body {
        display: grid; place-items: center; text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f4c96a; padding: 32px;
      }
      h1 { font-size: 40px; letter-spacing: 0.14em; margin: 0 0 12px; font-weight: 600; }
      p { color: #b9b3a6; font-size: 15px; line-height: 1.5; margin: 0; max-width: 22em; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #f4c96a; margin: 24px auto 0;
             animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }
    </style>
  </head>
  <body>
    <main>
      <h1>PLUGU</h1>
      <p>Connecting campus. Reconnect to the internet to plug back in.</p>
      <div class="dot"></div>
      <button id="retry" type="button" style="margin-top:22px;padding:12px 26px;border-radius:16px;border:1px solid rgba(244,201,106,.5);background:linear-gradient(140deg,#f4c96a,#b5822f);color:#160d03;font-weight:700;font-size:14px;">Try again</button>
      <p id="hint" style="margin-top:12px;font-size:11px;opacity:.55;">Check your connection and tap Try again.</p>
    </main>
      <script>
      // If the device is offline and this fallback loads, hide the native
      // splash so the user sees a branded screen instead of a frozen launch.
      window.addEventListener('DOMContentLoaded', function () {
        var sp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen;
        if (sp && sp.hide) sp.hide();
        var HOME = 'https://hbcuzone-connect.lovable.app/';
        function retry() { window.location.replace(HOME); }
        var btn = document.getElementById('retry');
        if (btn) btn.addEventListener('click', retry);
        // Auto-retry as soon as connectivity comes back, plus a slow poll.
        window.addEventListener('online', retry);
        setInterval(function () { if (navigator.onLine) retry(); }, 6000);
      });
    </script>
  </body>
</html>
